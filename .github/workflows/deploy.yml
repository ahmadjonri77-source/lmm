name: Deploy LMM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/lmm

            echo "===== PULLING LATEST CODE ====="
            git pull origin main

            echo "===== REBUILDING ====="
            docker compose down
            docker compose build
            docker compose up -d

            echo "===== STATUS ====="
            docker compose ps